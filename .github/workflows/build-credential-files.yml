name: Build credential files

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

jobs:
  build_credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate credential types
        run: node .github/scripts/build-credential-types-list.js

      - name: Generate credentials data
        run: node .github/scripts/build-credential-data.js

      - name: Commit generated files
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add _generated/credential-types.json
          git add _generated/credentials.json

          git commit -m "Auto update generated credential files [skip ci]" || echo "No changes"

          git push