name: Build credentials data

on:
  push:
    branches:
      - '**'
    paths:
      - "**/translations/**"
      - "**/input-fields/**"
      - "**/credential-types.json"
      - "**/user-consent/user-consent-map.json"
      - "**/user-consent/consent-groups.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate credentials data
        run: node .github/scripts/build-credential-data.js

      - name: Commit generated credentials
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add _autogen/credentials.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update credentials data"
          git push