name: Build credentials data

on:
    workflow_run:
      workflows: ["Update credential types list"]
      types:
        - completed

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run script
        run: node .github/scripts/build-credential-data.js

      - name: Commit generated credentials file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add _generated/credentials.json
          git commit -m "Auto update credentials data [skip ci]" || echo "No changes"
          git push